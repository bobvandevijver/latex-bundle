[Unit]
Description=bobv/latex-bundle podman pdflatex proxy service installer

[Service]
Type=oneshot
ExecStart=/usr/bin/cp /var/www/project/vendor/bobv/latex-bundle/podman_proxy/podman_proxy.py /home/bobv-latex-pdflatex/podman_proxy.py
ExecStart=/usr/bin/chown bobv-latex-pdflatex:bobv-latex-pdflatex /home/bobv-latex-pdflatex/podman_proxy.py
ExecStart=/usr/bin/chmod u+x /home/bobv-latex-pdflatex/podman_proxy.py
User=root
